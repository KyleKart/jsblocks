<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>JS Blocks</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/@blockly/workspace-backpack/dist/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nbstyle.css">
</head>

<body>

  <div id="menuBar">
    <div class="menu-item">
      <span>File</span>
      <div class="dropdown-content">
        <div id="menuSave">Save Project</div>
        <div id="menuLoad">Load Project</div>
        <div id="menuImportJS">Import JS</div>
        <div id="menuExportHTML" style="display:none;">Export HTML</div>
        <div id="menuExportSB3">Export SB3 (very basic)</div>
        <script>
          if (location.hash === '#dev') {
            document.getElementById('menuExportSB3').style.display = '';
          }
        </script>
      </div>
    </div>

    <div class="menu-item">
      <span>View</span>
      <div class="dropdown-content submenu-container">
        <div class="submenu-label">Font Family</div>
        <div class="menu-option font-select font-default">Default</div>
        <div class="menu-option font-select" data-font="Arial, sans-serif">Arial</div>
        <div class="menu-option font-select" data-font='"Fira Code", monospace'>Fira Code</div>
        <div class="menu-option font-select" data-font='"JetBrains Mono", monospace'>JetBrains Mono</div>
        <div class="menu-option font-select" data-font='"Miracode", monospace'>Miracode</div>
        <div class="submenu-divider"></div>

        <div class="submenu-label">Font Size</div>
        <div class="menu-option size-select size-default">Default</div>
        <div class="menu-option size-select" data-size="10">10px</div>
        <div class="menu-option size-select" data-size="12">12px</div>
        <div class="menu-option size-select" data-size="14">14px</div>
        <div class="menu-option size-select" data-size="16">16px</div>

        <div class="submenu-divider"></div>

        <div class="submenu-label">Renderer</div>
        <div class="menu-option renderer-select renderer-default">Default</div>
        <div class="menu-option renderer-select" data-renderer="geras">Geras</div>
        <div class="menu-option renderer-select" data-renderer="thrasos">Thrasos</div>
        <div class="menu-option renderer-select" data-renderer="zelos">Zelos</div>

        <div class="submenu-divider"></div>


        <div id="menuResetTheme" class="menu-option">Reset All</div>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="blocklyDiv"></div>
    <iframe id="stage" src="https://kylekart.github.io/jsblocks/vm.html" width="480" height="360">
    </iframe>
  </div>

  <xml id="toolbox" style="display: none">
    <block type="js_hat"></block>
    <block type="js_cblock"></block>
    <block type="js_generic"></block>
    <block type="js_expr"></block>
  </xml>

  <script src="nbscript.js"></script>

</body>

</html>
